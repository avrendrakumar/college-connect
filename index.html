<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Connect - College Timetable &amp; Room Availability</title>
    <meta name="description" content="Real-time college schedule, classroom &amp; lab availability tracker, holiday calendar, and timetable management system with Excel import." />
    
    <!-- Open Graph / Social Meta -->
    <meta property="og:title" content="College Connect - College Timetable &amp; Room Availability" />
    <meta property="og:description" content="Real-time college schedule, classroom &amp; lab availability tracker, holiday calendar, and timetable management system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#11123a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="College Connect" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Fonts: Unbounded (display), Familjen Grotesk (interface), DM Mono (times) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400..700&family=Unbounded:wght@500..900&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for offline availability & PWA compliance
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
